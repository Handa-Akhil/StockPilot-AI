version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: stockpilot-postgres
    environment:
      POSTGRES_USER: stockpilot
      POSTGRES_PASSWORD: stockpilot_password
      POSTGRES_DB: stockpilot
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: stockpilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
